# Asks the database every 30 minutes whether sign-up looks healthy and FAILS
# when it does not, so GitHub emails the alert. The verdict comes from the SQL
# function `signup_health` (supabase_schema.sql), which classifies the last
# 24 h of sign-up outcomes and decides when an alert is due, so this file
# carries no rule of its own.
#
# This log is PUBLIC (public repository), so it prints the verdict only.
# The numbers behind it: `npm run signup:health` locally.
#
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the public
# anon key; the function it calls is readable with it and writes nothing).
name: Sign-up health

on:
  schedule:
    # Off the top of the hour: GitHub delays and sometimes drops runs queued then.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: signup-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are not set"
            exit 1
          fi
          if ! body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 20 \
                -X POST "$SUPABASE_URL/rest/v1/rpc/signup_health" \
                -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                -H "Content-Type: application/json" -d '{}'); then
            echo "::error::the health query itself failed (Supabase unreachable or signup_health missing)"
            exit 1
          fi
          case "$(printf '%s' "$body" | jq -r '.alert')" in
            false) echo "sign-up: healthy" ;;
            true)  echo "::error::sign-up needs a look. Run: npm run signup:health"; exit 1 ;;
            *)     echo "::error::unexpected answer from signup_health"; exit 1 ;;
          esac
