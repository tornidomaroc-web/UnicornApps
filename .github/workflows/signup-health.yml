# Asks the database every 30 minutes whether sign-up looks healthy and FAILS
# when it does not, so GitHub emails the alert. The verdict comes from the SQL
# function `signup_health_verdict` (supabase_schema.sql): one boolean, computed
# by `signup_health`, which classifies the last 24 h of sign-up outcomes and
# decides when an alert is due. This file carries no rule of its own.
#
# GitHub delays scheduled runs by hours and drops most of them (measured: 7 of
# 76 slots ran in the first 38 h). The verdict's alert windows are short (65 min
# after a failure, then one 30-minute slot every 6 h), so a run that only asks
# "now?" almost never lands in one. A scheduled run therefore asks for every
# :07/:37 slot since the previous run started (at most 24 h back) and fails if
# any slot was due. Each slot is asked by exactly one run, so a missed slot is
# reported late, never lost, and never twice. A manual run asks "now?" only.
#
# This log is PUBLIC (public repository), and so is the function this calls:
# both carry the verdict only, nothing countable. The numbers behind it need
# the service role: `npm run signup:health` locally.
#
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (the public
# anon key; the function it calls is readable with it and writes nothing).
name: Sign-up health

on:
  schedule:
    # Off the top of the hour: GitHub delays and sometimes drops runs queued then.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: read  # to find when the previous run started

concurrency:
  group: signup-health
  cancel-in-progress: false

env:
  # Every sign-in provider that is MEANT to be on in Supabase, space-separated.
  # The step below reads the live list and fails when the two differ, so a
  # provider switched on in the dashboard is a deliberate one-word change here,
  # never a silent one: a Google account is born with 0 credits only once the
  # free-credit claim migration is live (migrations/2026-10-10_add_free_credit_claim.sql).
  ALLOWED_AUTH_PROVIDERS: email

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare the enabled sign-in providers with the allowlist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are not set"
            exit 1
          fi
          # Public, read-only: the auth server's settings endpoint reports each
          # provider's switch from its running config (anonymous_users included).
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 20 \
              "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY") \
            || { echo "::error::could not read /auth/v1/settings"; exit 1; }
          enabled=$(printf '%s' "$body" | jq -r '.external | to_entries[] | select(.value == true) | .key' | sort | tr '\n' ' ' | sed 's/ $//')
          allowed=$(printf '%s\n' $ALLOWED_AUTH_PROVIDERS | sort | tr '\n' ' ' | sed 's/ $//')
          echo "enabled providers: ${enabled:-none}"
          if [ "$enabled" != "$allowed" ]; then
            echo "::error::sign-in providers differ from the allowlist (enabled: '${enabled:-none}', allowed: '$allowed'). Switch the provider back off, or change ALLOWED_AUTH_PROVIDERS on purpose."
            exit 1
          fi
      - name: Ask the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are not set"
            exit 1
          fi
          verdict() {  # $1 = p_now (ISO 8601, UTC) or empty for now()
            local args='{}' body
            [ -n "$1" ] && args=$(jq -nc --arg t "$1" '{p_now: $t}')
            body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 20 \
                -X POST "$SUPABASE_URL/rest/v1/rpc/signup_health_verdict" \
                -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                -H "Content-Type: application/json" -d "$args") || return 2
            # PostgREST returns a scalar function's result as a bare JSON value.
            case "$(printf '%s' "$body" | jq -r '.')" in
              false) return 1 ;; true) return 0 ;; *) return 3 ;;
            esac
          }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/signup-health.yml/runs"
            upper=$(date -u -d "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)" +%s)
            prev=$(gh api "$runs?status=completed&per_page=50" --jq "[.workflow_runs[]
                | select(.id != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))
                | .run_started_at] | max // empty")
            lower=$(( upper - 86400 ))
            if [ -n "$prev" ]; then p=$(date -u -d "$prev" +%s); [ "$p" -gt "$lower" ] && lower=$p; fi
            slots=()
            for (( t = lower - lower % 3600 + 420; t <= upper; t += 1800 )); do
              [ "$t" -gt "$lower" ] && slots+=("$(date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ)")
            done
          else
            slots=("")
          fi
          due=0
          for s in "${slots[@]}"; do
            rc=0; verdict "$s" || rc=$?
            case $rc in
              0) due=1 ;; 1) ;;
              2) echo "::error::the health query itself failed (Supabase unreachable or signup_health_verdict missing)"; exit 1 ;;
              *) echo "::error::unexpected answer from signup_health_verdict"; exit 1 ;;
            esac
          done
          echo "slots asked: ${#slots[@]}"
          if [ "$due" = 1 ]; then echo "::error::sign-up needs a look. Run: npm run signup:health"; exit 1; fi
          echo "sign-up: healthy"
